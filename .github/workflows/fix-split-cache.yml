name: Fix split cache updater

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch split updater
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          ROOT = Path('.')

          def runtime_block(fallback: str, doubled: bool = False) -> str:
              empty = '{{}}' if doubled else '{}'
              return f'''local __NA_SPLIT_REMOTE_CHANGED = __NA_SPLIT_REMOTE_META ~= nil
          \tand (__NA_SPLIT_LOCAL_META == nil or __NA_SPLIT_REMOTE_META.version ~= __NA_SPLIT_LOCAL_META.version)
          local __NA_SPLIT_COUNT = math.max(0, math.floor(tonumber(
          \t(__NA_SPLIT_REMOTE_META and __NA_SPLIT_REMOTE_META.count)
          \t\tor (__NA_SPLIT_LOCAL_META and __NA_SPLIT_LOCAL_META.count)
          \t\tor {fallback}
          ) or 0))
          local __NA_SPLIT_CACHE_ROOT = __NA_SPLIT_LOCAL_ROOT or __NA_SPLIT_LOCAL_ROOTS[1]
          local __NA_SPLIT_PENDING_CACHE = {empty}
          local __NA_SPLIT_CACHE_MANIFEST = __NA_SPLIT_REMOTE_META ~= nil and (
          \t__NA_SPLIT_LOCAL_META == nil
          \tor __NA_SPLIT_REMOTE_CHANGED
          \tor type(__NA_SPLIT_LOCAL_META.parts) ~= "table"
          \tor __NA_SPLIT_LOCAL_META.loader_version ~= __NA_SPLIT_REMOTE_META.loader_version
          )

          local function __NA_SPLIT_PART_FINGERPRINT(meta, partName)
          \tlocal parts = type(meta) == "table" and meta.parts or nil
          \tlocal fingerprint = type(parts) == "table" and parts[partName] or nil
          \treturn type(fingerprint) == "string" and fingerprint ~= "" and fingerprint or nil
          end

          local function __NA_SPLIT_READ_PART(partName)
          \tlocal localSource = __NA_SPLIT_LOCAL_ROOT and __NA_SPLIT_READ_LOCAL(__NA_SPLIT_LOCAL_ROOT, partName) or nil
          \tif not __NA_SPLIT_REMOTE_META then
          \t\tif localSource then
          \t\t\treturn localSource
          \t\tend
          \t\terror("Nameless Admin chunk unavailable: "..partName, 0)
          \tend

          \tif localSource then
          \t\tlocal remoteFingerprint = __NA_SPLIT_PART_FINGERPRINT(__NA_SPLIT_REMOTE_META, partName)
          \t\tlocal localFingerprint = __NA_SPLIT_PART_FINGERPRINT(__NA_SPLIT_LOCAL_META, partName)
          \t\tif remoteFingerprint and localFingerprint and remoteFingerprint == localFingerprint then
          \t\t\treturn localSource
          \t\tend
          \t\tif not __NA_SPLIT_REMOTE_CHANGED and not localFingerprint then
          \t\t\treturn localSource
          \t\tend
          \tend

          \tlocal remote = __NA_SPLIT_READ_REMOTE(partName)
          \tif remote then
          \t\t__NA_SPLIT_PENDING_CACHE[partName] = remote
          \t\treturn remote
          \tend
          \terror("Nameless Admin chunk unavailable: "..partName, 0)
          end

          local function __NA_SPLIT_CACHE_REMOTE()
          \tif not __NA_SPLIT_CACHE_MANIFEST or not __NA_SPLIT_REMOTE_MANIFEST_SOURCE or type(writefile) ~= "function" then
          \t\treturn
          \tend
          \tif type(makefolder) == "function" then
          \t\tlocal parent = __NA_SPLIT_CACHE_ROOT:gsub("/$", "")
          \t\tlocal current = ""
          \t\tfor segment in parent:gmatch("[^/]+") do
          \t\t\tcurrent = current == "" and segment or current.."/"..segment
          \t\t\tpcall(makefolder, current)
          \t\tend
          \tend
          \tfor partName, source in __NA_SPLIT_PENDING_CACHE do
          \t\tpcall(writefile, __NA_SPLIT_CACHE_ROOT..partName, source)
          \tend
          \tpcall(writefile, __NA_SPLIT_CACHE_ROOT.."manifest.lua", __NA_SPLIT_REMOTE_MANIFEST_SOURCE)
          end
          '''

          def patch_loader(path: Path, fallback: str, doubled: bool = False) -> None:
              source = path.read_text(encoding='utf-8')
              start = source.index('local __NA_SPLIT_USE_REMOTE =')
              end = source.index('\nlocal function __NA_SPLIT_LOAD_PART', start)
              path.write_text(source[:start] + runtime_block(fallback, doubled) + source[end:], encoding='utf-8', newline='\n')

          patch_loader(ROOT / 'Source.lua', '29')
          patch_loader(ROOT / 'NA testing.lua', '29')
          patch_loader(ROOT / 'tools/build_split_na.py', '{chunk_count}', True)

          builder = ROOT / 'tools/build_split_na.py'
          source = builder.read_text(encoding='utf-8')
          start = source.index('def write_chunks(chunks: list[list[str]]) -> None:')
          end = source.index('\n\nBOOT_LOADER =', start)
          replacement = '''def _git_blob_sha(data: bytes) -> str:
              header = f"blob {len(data)}\\0".encode("ascii")
              return hashlib.sha1(header + data).hexdigest()


          def write_chunks(chunks: list[list[str]]) -> None:
              previous_manifest = (COMMON / "manifest.lua").read_text(encoding="utf-8") if (COMMON / "manifest.lua").exists() else ""
              loader_version_match = re.search(r'loader_version\\s*=\\s*"([^"]+)"', previous_manifest)
              loader_version = loader_version_match.group(1) if loader_version_match else None
              cache_loader_start = previous_manifest.find("local function cacheLoader()")
              cache_loader_suffix = previous_manifest[cache_loader_start:] if cache_loader_start >= 0 else ""

              if COMMON.exists():
                  shutil.rmtree(COMMON)
              COMMON.mkdir(parents=True)
              digest = hashlib.sha256()
              fingerprints: dict[str, str] = {}
              for index, chunk in enumerate(chunks, start=1):
                  part_name = f"part-{index:03d}.lua"
                  path = COMMON / part_name
                  data = ("\\n".join(chunk).rstrip() + "\\n").encode("utf-8")
                  path.write_bytes(data)
                  digest.update(f"{part_name}\\0".encode("utf-8"))
                  digest.update(data)
                  fingerprints[part_name] = _git_blob_sha(data)
              version = digest.hexdigest()[:16]

              manifest = [
                  "local meta = {",
                  f'\\tversion = "{version}";',
                  f"\\tcount = {len(chunks)};",
                  '\\tdirectory = "common";',
              ]
              if loader_version:
                  manifest.append(f'\\tloader_version = "{loader_version}";')
              manifest.append("\\tparts = {")
              for part_name, fingerprint in fingerprints.items():
                  manifest.append(f'\\t\\t["{part_name}"] = "{fingerprint}";')
              manifest.extend(["\\t};", "}", ""])
              if cache_loader_suffix:
                  manifest.append(cache_loader_suffix.rstrip())
              else:
                  manifest.append("return meta")
              manifest.append("")
              (COMMON / "manifest.lua").write_text("\\n".join(manifest), encoding="utf-8", newline="\\n")
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          builder.write_text(source[:start] + replacement + source[end:], encoding='utf-8', newline='\n')

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          source_sha = git_blob_sha(ROOT / 'Source.lua')
          testing_sha = git_blob_sha(ROOT / 'NA testing.lua')
          loader_version = f'20260914-{source_sha[:8]}-{testing_sha[:8]}'

          manifest_path = ROOT / 'NA-split/common/manifest.lua'
          old_manifest = manifest_path.read_text(encoding='utf-8')
          version_match = re.search(r'version\s*=\s*"([^"]+)"', old_manifest)
          if not version_match:
              raise RuntimeError('manifest version missing')
          version = version_match.group(1)
          suffix_start = old_manifest.find('local function cacheLoader()')
          suffix = old_manifest[suffix_start:] if suffix_start >= 0 else 'return meta\n'
          parts = sorted((ROOT / 'NA-split/common').glob('part-*.lua'))
          lines = [
              'local meta = {',
              f'\tversion = "{version}";',
              f'\tcount = {len(parts)};',
              '\tdirectory = "common";',
              f'\tloader_version = "{loader_version}";',
              '\tparts = {',
          ]
          for part in parts:
              lines.append(f'\t\t["{part.name}"] = "{git_blob_sha(part)}";')
          lines.extend(['\t};', '}', '', suffix.rstrip(), ''])
          manifest_path.write_text('\n'.join(lines), encoding='utf-8', newline='\n')

          subprocess.run(['python', '-m', 'py_compile', 'tools/build_split_na.py'], check=True)
          for file_name in ('Source.lua', 'NA testing.lua'):
              text = (ROOT / file_name).read_text(encoding='utf-8')
              assert '__NA_SPLIT_USE_REMOTE' not in text
              assert '__NA_SPLIT_PART_FINGERPRINT' in text
          manifest_text = manifest_path.read_text(encoding='utf-8')
          assert manifest_text.count('["part-') == len(parts)
          assert 'loader_version = ' in manifest_text
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source.lua "NA testing.lua" tools/build_split_na.py NA-split/common/manifest.lua
          git diff --cached --check
          git commit -m "Fix split cache to update only changed chunks"
          git push origin HEAD:main
